name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The isolation and numbering suites skip themselves without DATABASE_URL,
    # and a silently skipped isolation test is worse than no test -- so CI
    # always provides a real Postgres.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kitaflux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kitaflux_test?schema=public
      BETTER_AUTH_SECRET: ci-secret-not-used-outside-ci
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # See the README: better-auth's peerOptional on vitest makes npm's strict
      # resolver fail. Dev tooling only.
      - run: npm ci --legacy-peer-deps

      - run: npm run db:deploy

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
